name: Build il2_scan for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow pystray

      - name: Check required files
        shell: pwsh
        run: |
          if (!(Test-Path 'il2_source.py')) { throw 'Missing il2_source.py' }
          if (!(Test-Path 'assets/icon.ico')) { throw 'Missing assets/icon.ico' }

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name il2_scan --distpath . --icon assets/icon.ico --add-data 'assets;assets' il2_source.py
          if (!(Test-Path 'il2_scan.exe')) { throw 'EXE not created' }
          Get-FileHash 'il2_scan.exe' -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: il2_scan-windows
          path: il2_scan.exe
          if-no-files-found: error

      - name: Publish release for version tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload "v2.1" "il2_scan.exe" --clobber
